<ion-content class="ion-padding">
  <div class="marca">
    <ion-icon name="leaf-outline" color="primary"></ion-icon>
    <h1>Cosecha Directa</h1>
    <p>Mercado fresco del altiplano a la puerta de su casa</p>
  </div>

  <form (ngSubmit)="ingresar()">
    <ion-list lines="full">
      <ion-item>
        <ion-input
          data-test="usuario"
          label="Usuario"
          labelPlacement="stacked"
          name="usuario"
          autocomplete="username"
          autocapitalize="off"
          [(ngModel)]="usuario"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          data-test="contrasena"
          label="Contraseña"
          labelPlacement="stacked"
          name="contrasena"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="contrasena"
        >
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-item>
    </ion-list>

    @if (error()) {
      <ion-text color="danger"><p class="error" data-test="error">{{ error() }}</p></ion-text>
    }

    <ion-button data-test="ingresar" type="submit" expand="block" [disabled]="enviando()">
      @if (enviando()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Ingresar
      }
    </ion-button>
  </form>

  <ion-note class="demo">
    Cuenta de demostración del API: usuario <strong>emilys</strong>, contraseña <strong>emilyspass</strong>.
  </ion-note>
</ion-content>
